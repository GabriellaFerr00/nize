# Orchestrator (design.md "CI/CD", docs/ci-cd.md): detects what changed and runs only the
# matching pipeline. Every deploy is preceded by unit, integration and security checks (NFR-010).
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "What to run: auto detects changes against main"
        type: choice
        options: [auto, backend, frontend, both]
        default: auto

permissions:
  contents: read

concurrency:
  # One run per branch at a time; never cancel a run that may be halfway through a migration or deploy.
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # On a branch dispatch, compare with main; on push, with the previous commit.
          base: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
              - 'scripts/ci/**'
              - '.semgrep/**'
              - '.zap/**'
              - '.gitleaks.toml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
              - 'scripts/ci/**'
              - '.semgrep/**'
              - '.gitleaks.toml'
      - name: Decide
        id: decide
        env:
          TARGET: ${{ inputs.target || 'auto' }}
          CHANGED_BACKEND: ${{ steps.filter.outputs.backend }}
          CHANGED_FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          case "$TARGET" in
            backend)  backend=true;  frontend=false ;;
            frontend) backend=false; frontend=true ;;
            both)     backend=true;  frontend=true ;;
            *)        backend=$CHANGED_BACKEND; frontend=$CHANGED_FRONTEND ;;
          esac
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "### Pipelines: backend=$backend, frontend=$frontend (target=$TARGET)" >> "$GITHUB_STEP_SUMMARY"

  backend-pipeline:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-deploy.yml
    permissions:
      contents: read
      packages: write         # push the verified image to GHCR
      security-events: write  # SARIF to Code Scanning
      issues: write           # issue for medium/low findings
      actions: read           # CodeQL
    secrets:
      NIZE_DB_ROOT_PASSWORD_TEST: ${{ secrets.NIZE_DB_ROOT_PASSWORD_TEST }}

  frontend-pipeline:
    name: Frontend
    # Waits for the backend when both changed, so the site never goes out ahead of an API that failed.
    needs: [changes, backend-pipeline]
    if: >-
      always() && needs.changes.outputs.frontend == 'true' &&
      (needs.backend-pipeline.result == 'success' || needs.backend-pipeline.result == 'skipped')
    uses: ./.github/workflows/frontend-deploy.yml
    permissions:
      contents: read
      security-events: write
      issues: write
      actions: read
    secrets:
      NIZE_DB_ROOT_PASSWORD_TEST: ${{ secrets.NIZE_DB_ROOT_PASSWORD_TEST }}
