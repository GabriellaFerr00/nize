# Frontend (design.md "CI/CD"): lint + tests + coverage + build → gate (Security and Integration
# tests of this commit passed) → Cloudflare Pages (preview on PRs, production on main) → smoke.
name: Frontend

on:
  push:
    branches: [main]
    paths: &frontend-paths
      - frontend/**
      - scripts/ci/**
      - .github/workflows/frontend.yml
  pull_request:
    branches: [main]
    paths: *frontend-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint, tests, coverage and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type-check the Pages Function and the E2E files
        run: npm run typecheck:tooling
      - name: Tests with coverage
        env:
          COVERAGE_MIN: ${{ vars.COVERAGE_MIN || '80' }}
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

  gate:
    name: Gate (Security and Integration tests passed)
    needs: build
    # Forks get no secrets: no preview deploy for them.
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for the other workflows of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          # On a pull request the other workflows run on the PR head commit.
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci/wait-for-workflows.sh "$COMMIT" "Security" "Integration tests"

  deploy:
    name: Cloudflare Pages
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # main → production (required reviewers); pull requests and other branches → preview in "staging".
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Branch name for Cloudflare
        id: branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        # Never interpolate a raw branch name into a command: keep only safe characters.
        run: echo "name=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"
      - name: Publish
        id: wrangler
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.1"
          # Run from frontend/ so wrangler also bundles functions/ (the /api proxy, D-15).
          workingDirectory: frontend
          command: >-
            pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }}
            --branch=${{ steps.branch.outputs.name }} --commit-hash=${{ github.sha }} --commit-dirty=false
      - name: Deployment URL
        id: publish
        env:
          DEPLOYMENT_URL: ${{ steps.wrangler.outputs.deployment-url }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then url="https://$PROJECT.pages.dev"; else url="$DEPLOYMENT_URL"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Frontend published: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test (headers, SPA fallback, /api proxy)
        env:
          SITE_URL: ${{ steps.publish.outputs.url }}
          # The /api proxy is checked once the API exists (repository variable API_URL is set).
          CHECK_API: ${{ vars.API_URL != '' }}
        run: scripts/ci/frontend-smoke.sh "$SITE_URL" "$CHECK_API"
      - name: Rollback notes
        if: always()
        env:
          CF_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          echo "- Rollback: Cloudflare → Workers & Pages → $CF_PROJECT → Deployments → previous → Rollback, or re-run this workflow on an older commit (docs/ci-cd.md)." >> "$GITHUB_STEP_SUMMARY"
