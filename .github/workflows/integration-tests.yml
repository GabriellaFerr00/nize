# Integration tests (reusable and manual). Synthetic data only; never production data.
# - api-h2: the @SpringBootTest API suite on H2 (skipped in the pipelines: their build job runs it).
# - mysql-e2e: real MySQL 8.4 → migrations with the migration user → app in profile prod with the
#   runtime user (no DDL, no Flyway) → smoke → Playwright E2E → log check (NFR-008/009/010).
name: Integration tests

on:
  workflow_call:
    inputs:
      include_h2_suite:
        type: boolean
        default: true
    secrets:
      NIZE_DB_ROOT_PASSWORD_TEST:
        required: true
  workflow_dispatch:
    inputs:
      include_h2_suite:
        description: Also run the H2 API suite
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  api-h2:
    name: API suite (H2)
    if: inputs.include_h2_suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify
        working-directory: backend
        env:
          COVERAGE_MIN: ${{ vars.COVERAGE_MIN || '80' }}
        run: ./mvnw -B -ntp verify -Dcoverage.min="$(awk -v v="$COVERAGE_MIN" 'BEGIN { print v / 100 }')"

  mysql-e2e:
    name: MySQL 8.4, least-privilege app and E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.NIZE_DB_ROOT_PASSWORD_TEST }}
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      MYSQL_ROOT_PASSWORD: ${{ secrets.NIZE_DB_ROOT_PASSWORD_TEST }}
      NIZE_DB_MIGRATION_USER: nize_migrator
      NIZE_DB_USER: nize_app
      # The container's self-signed certificate is enough to exercise sslMode=REQUIRED.
      DB_URL: jdbc:mysql://127.0.0.1:3306/nize?sslMode=REQUIRED
      E2E_PASSWORD: E2e-synthetic-pass-1 # the synthetic password used by frontend/e2e (checked against the log)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Per-run credentials (random, masked, gone with the job)
        run: |
          echo "MYSQL_CONTAINER=${{ job.services.mysql.id }}" >> "$GITHUB_ENV"
          for name in NIZE_DB_MIGRATION_PASSWORD NIZE_DB_PASSWORD NIZE_JWT_SECRET; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Create the database and the two users
        run: scripts/ci/mysql-setup.sh
      - name: Flyway with the migration user (twice, to prove it is idempotent)
        working-directory: backend
        env:
          FLYWAY_URL: ${{ env.DB_URL }}
          FLYWAY_USER: ${{ env.NIZE_DB_MIGRATION_USER }}
          FLYWAY_PASSWORD: ${{ env.NIZE_DB_MIGRATION_PASSWORD }}
        run: |
          ./mvnw -B -ntp -q flyway:migrate
          ./mvnw -B -ntp -q flyway:migrate
          ./mvnw -B -ntp -q flyway:validate
      - name: Schema rules (money BIGINT, only hashes, no forbidden personal data)
        run: |
          out=$(docker exec -i -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" "$MYSQL_CONTAINER" mysql -uroot -N < scripts/ci/check-schema.sql)
          if [ -n "$out" ]; then echo "::error::schema rule violations"; echo "$out"; exit 1; fi
      - name: The runtime user cannot change the schema
        run: scripts/ci/check-runtime-privileges.sh
      - name: Build the jar
        working-directory: backend
        run: ./mvnw -B -ntp -q -DskipTests -Djacoco.skip=true package
      - name: Start the API (profile prod, runtime user, Flyway off)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: prod
          NIZE_DB_URL: ${{ env.DB_URL }}
        run: |
          nohup java -jar target/nize-backend-*.jar > "$RUNNER_TEMP/app.log" 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
      - name: API smoke
        run: scripts/ci/api-smoke.sh http://localhost:8080 180
      - name: E2E (Playwright)
        working-directory: frontend
        env:
          CI: "true"
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Stop the API and check its log for secrets
        id: logcheck
        if: always() && env.APP_PID != ''
        run: |
          kill "$APP_PID" 2>/dev/null || true
          sleep 3
          scripts/ci/check-logs.sh "$RUNNER_TEMP/app.log" \
            "$NIZE_DB_PASSWORD" "$NIZE_DB_MIGRATION_PASSWORD" "$NIZE_JWT_SECRET" "$E2E_PASSWORD"
      - name: API log (only after it was proven free of secrets)
        if: failure() && steps.logcheck.outcome == 'success'
        run: tail -n 200 "$RUNNER_TEMP/app.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
