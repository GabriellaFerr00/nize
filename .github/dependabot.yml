# Weekly dependency updates (security.yml §4.5). Minor/patch updates are grouped to keep PR noise low;
# the cooldown waits a few days after a release, so a hijacked version is usually pulled before we adopt it.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 5 }
    groups:
      maven-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 5 }
    groups:
      npm-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 5 }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 5 }
